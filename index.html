<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelloMonady｜社群工作台</title>
  <style>
    :root {
      --brand: #d3783c;
      --brand-deep: #a75324;
      --brand-soft: #f7e9dc;
      --background: #f7f5f2;
      --surface: #ffffff;
      --surface-soft: #fdfaf7;
      --ink: #302821;
      --muted: #786b61;
      --line: #e7ddd5;
      --placeholder: #a99c91;
      --phone-ink: #241f1b;
      --phone-screen: #fffefd;
      --preview: #eee7df;
      --line-chat: #dcecf6;
      --shadow: rgba(75, 48, 31, .08);
      --focus: rgba(211, 120, 60, .2);
      --modal-backdrop: rgba(36, 31, 27, .48);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      line-height: 1.5;
    }

    button, input, textarea { font: inherit; }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px clamp(24px, 4vw, 64px);
      background: var(--brand);
      color: var(--surface);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(22px, 2vw, 29px);
      font-weight: 700;
      letter-spacing: .045em;
    }

    .topbar .account {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .015em;
      white-space: nowrap;
    }

    .topbar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    .header-button {
      padding: 8px 14px;
      border: 1px solid var(--surface);
      border-radius: 9px;
      background: transparent;
      color: var(--surface);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .header-button:hover, .header-button:focus-visible { background: var(--brand-deep); }

    .page {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 42px clamp(20px, 4vw, 64px) 58px;
    }

    .intro { margin-bottom: 30px; }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .intro h2 {
      margin: 0;
      font-size: clamp(25px, 2.5vw, 35px);
      font-weight: 700;
      letter-spacing: .03em;
    }

    .intro p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(260px, .88fr) minmax(360px, 1.28fr) minmax(280px, .9fr);
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      min-height: 670px;
      padding: 27px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: 0 12px 35px var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 20px;
      margin-bottom: 23px;
      border-bottom: 1px solid var(--line);
    }

    .panel-heading h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .035em;
    }

    .panel-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .panel-tag {
      flex: none;
      padding: 5px 9px;
      border-radius: 7px;
      background: var(--brand-soft);
      color: var(--brand-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .field + .field { margin-top: 19px; }

    .field label {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .field .required {
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 600;
    }

    .field .optional {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .field input,
    .post-content {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--ink);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .field input {
      min-height: 46px;
      padding: 11px 13px;
      font-size: 13px;
    }

    .field input::placeholder,
    .post-content::placeholder { color: var(--placeholder); opacity: 1; }

    .field input:focus,
    .post-content:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .build-button, .primary-button, .secondary-button {
      padding: 11px 17px;
      border: 1px solid var(--brand);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .build-button, .primary-button { background: var(--brand); color: var(--surface); }
    .build-button { width: 100%; margin-top: 27px; }
    .save-post-button { margin-top: 10px; }
    .secondary-button { background: var(--surface); color: var(--brand-deep); }

    .save-status { min-height: 20px; margin: 9px 0 0; color: var(--muted); font-size: 12px; }
    #ai-write-questions { white-space: pre-wrap; }
    #ai-write-status.is-error { color: #b42318; }
    #ai-write-warning { color: #9a5b18; }
    #ai-write-raw { white-space: pre-wrap; overflow-wrap: anywhere; }
    #write-with-ai:disabled { border-color: #a8a29e; background: #a8a29e; cursor: not-allowed; }

    .build-button:hover, .primary-button:hover { background: var(--brand-deep); }

    .build-button:focus-visible, .primary-button:focus-visible,
    .secondary-button:focus-visible, .modal-close:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .modal {
      width: min(760px, calc(100vw - 30px));
      max-height: min(85vh, 850px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 24px 60px var(--shadow);
    }

    .modal::backdrop { background: var(--modal-backdrop); }

    .modal-header, .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 19px 24px;
    }

    .modal-header { border-bottom: 1px solid var(--line); }
    .modal-footer { border-top: 1px solid var(--line); }
    .modal-header h2 { margin: 0; font-size: 20px; }

    .modal-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }

    .modal-body { display: grid; gap: 20px; max-height: calc(85vh - 145px); padding: 22px 24px; overflow: auto; }

    .modal-field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }

    .modal-field textarea {
      display: block;
      width: 100%;
      min-height: 210px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
    }

    .modal-field textarea:focus { outline: 3px solid var(--focus); border-color: var(--brand); }
    .modal-field input, .modal-field select {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 13px;
    }
    .modal-field input:focus, .modal-field select:focus { outline: 3px solid var(--focus); border-color: var(--brand); }
    .ai-settings-group { display: grid; gap: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; }
    .ai-settings-group h3 { margin: 0; font-size: 16px; }
    .modal-field .prompt-textarea { min-height: 330px; }
    .modal-status { margin: 0; color: var(--muted); font-size: 13px; }

    .saved-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .board-column {
      min-width: 0;
      min-height: 240px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .board-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .board-title { margin: 0; font-size: 14px; }
    .board-count { padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; }
    .board-cards { display: grid; gap: 10px; }
    .board-empty { margin: 5px 0; color: var(--muted); font-size: 13px; }

    .saved-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .saved-item-info { min-width: 0; }
    .saved-item-name { margin: 0; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
    .saved-item-time { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .saved-item-actions { display: flex; flex: none; gap: 7px; }
    .saved-item-actions button { padding: 7px 10px; }
    .board-column .saved-item { display: block; padding: 12px; background: var(--surface); }
    .board-column .saved-item-actions { margin-top: 11px; }
    .status-select { width: 100%; margin-top: 11px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; }

    .editor-panel { display: flex; flex-direction: column; }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }

    .tab {
      min-width: 106px;
      padding: 10px 18px;
      border: 1px solid var(--brand);
      border-radius: 9px;
      background: var(--brand);
      color: var(--surface);
      font-size: 14px;
      font-weight: 700;
      cursor: default;
    }

    .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .tab[aria-selected="false"] {
      border-color: var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .editor-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .post-content {
      flex: 1;
      min-height: 430px;
      padding: 17px 18px;
      resize: vertical;
      font-size: 15px;
      line-height: 1.8;
    }

    .character-count {
      min-height: 22px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .character-count.is-over {
      color: #b42318;
      font-weight: 700;
    }

    .undo-button { align-self: flex-start; margin-top: 8px; }
    .review-report { display: grid; gap: 3px; overflow-wrap: anywhere; }
    .review-report-line { padding: 5px 8px; border-radius: 6px; white-space: pre-wrap; }
    .review-report-line.is-failure { background: #fde8e7; }
    .review-report-line.is-warning { background: #fff3cb; }
    #review-status.is-error, #review-fix-status.is-error { color: #b42318; }
    .ai-helper { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .ai-helper h3 { margin: 0 0 12px; font-size: 16px; }
    .ai-helper-history { max-height: 280px; overflow-y: auto; display: grid; gap: 10px; }
    .ai-helper-message { padding: 10px 12px; border-radius: 9px; background: var(--surface-soft); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ai-helper-message strong { display: block; margin-bottom: 4px; color: var(--brand-deep); }
    .ai-helper-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ai-helper-actions button { padding: 7px 10px; font-size: 12px; }
    .ai-helper-form { display: flex; gap: 8px; margin-top: 12px; }
    .ai-helper-form input { flex: 1; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); color: var(--ink); }
    .ai-helper-status { margin: 8px 0 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
    .ai-helper-status.is-error { color: #b42318; }
    .ai-helper button:disabled { opacity: .55; cursor: not-allowed; }

    .preview-panel { background: var(--surface-soft); }

    .phone-wrap { display: flex; justify-content: center; padding: 0 0 4px; }

    .image-upload {
      display: grid;
      gap: 7px;
      width: min(100%, 278px);
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .image-upload input {
      width: 100%;
      color: var(--ink);
      font-size: 12px;
      font-weight: 400;
    }

    .phone {
      width: min(100%, 278px);
      padding: 10px;
      border: 7px solid var(--phone-ink);
      border-radius: 39px;
      background: var(--phone-ink);
      box-shadow: 0 19px 32px var(--shadow);
    }

    .phone-screen {
      overflow: hidden;
      min-height: 460px;
      border-radius: 27px;
      background: var(--phone-screen);
    }

    .phone-status {
      position: relative;
      height: 29px;
      border-bottom: 1px solid var(--line);
    }

    .phone-status::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      width: 66px;
      height: 14px;
      border-radius: 0 0 11px 11px;
      background: var(--phone-ink);
      transform: translateX(-50%);
    }

    .social-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 12px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      flex: none;
      border-radius: 50%;
      background: var(--brand);
      color: var(--surface);
      font-size: 16px;
      font-family: Georgia, serif;
      font-weight: 700;
    }

    .social-account {
      min-width: 0;
      overflow: hidden;
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-image {
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 1;
      padding: 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--preview);
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .preview-image.is-placeholder {
      color: var(--placeholder);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .08em;
    }

    .preview-image.has-upload {
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .social-actions {
      display: flex;
      gap: 13px;
      padding: 9px 13px 8px;
      font-size: 20px;
      line-height: 1;
    }

    .preview-copy {
      margin: 0;
      padding: 5px 13px 19px;
      font-size: 12px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .preview-date {
      padding: 0 13px 15px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .is-placeholder { color: var(--placeholder); }

    .social-meta { display: grid; gap: 1px; }

    .social-time { color: var(--muted); font-size: 10px; }

    .fb-image { aspect-ratio: 1.5 / 1; font-size: 12px; font-weight: 400; }

    .fb-actions {
      display: flex;
      justify-content: space-around;
      padding: 12px 4px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .line-screen { background: var(--line-chat); }

    .line-chat-row { display: flex; align-items: flex-start; gap: 8px; padding: 20px 11px; }

    .line-bubble {
      max-width: calc(100% - 42px);
      padding: 11px 13px;
      border-radius: 4px 14px 14px 14px;
      background: var(--surface);
      font-size: 12px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .line-bubble .preview-date { padding: 5px 0 0; }

    .threads-post { display: flex; align-items: flex-start; gap: 9px; padding: 18px 12px; }

    .threads-body { min-width: 0; flex: 1; }

    .threads-body .preview-copy { padding: 5px 0 0; }
    .threads-body .preview-date { padding: 4px 0 0; }

    @media (max-width: 1120px) {
      .workspace { grid-template-columns: minmax(260px, .95fr) minmax(360px, 1.25fr); }
      .preview-panel { grid-column: 1 / -1; min-height: auto; }
    }

    @media (max-width: 880px) {
      .saved-board { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 3px; }
      .topbar-actions { width: 100%; justify-content: space-between; }
      .page { padding-top: 28px; }
      .workspace { grid-template-columns: 1fr; }
      .panel { min-height: auto; padding: 22px; }
      .preview-panel { grid-column: auto; }
      .post-content { min-height: 340px; }
      .saved-item { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 id="page-title"></h1>
    <div class="topbar-actions">
      <p class="account" id="top-account"></p>
      <button class="header-button" id="open-posts" type="button">📁 我的貼文</button>
      <button class="header-button" id="new-post" type="button">＋ 新的一篇</button>
      <button class="header-button" id="open-settings" type="button">⚙ 設定</button>
    </div>
  </header>

  <main class="page">
    <div class="intro">
      <span class="eyebrow">貼文準備區</span>
      <h2>把想分享的穿搭，整理成一篇貼文。</h2>
      <p>先記下素材，再在中間編排文字；右側保留手機畫面作為版面參考。</p>
    </div>

    <div class="workspace">
      <section class="panel" aria-labelledby="material-title">
        <div class="panel-heading">
          <div>
            <h3 id="material-title">素材卡</h3>
            <p>記下這篇貼文會用到的資訊</p>
          </div>
          <span class="panel-tag">素材</span>
        </div>
        <div id="material-fields"></div>
        <button class="build-button" id="build-prompt" type="button">🧩 組好指令</button>
        <button class="build-button save-post-button" id="write-with-ai" type="button">✨ 讓 AI 寫</button>
        <p class="save-status" id="ai-write-status" role="status"></p>
        <p class="save-status" id="ai-write-warning" hidden></p>
        <p class="save-status" id="ai-write-usage" hidden></p>
        <p class="save-status" id="ai-write-raw" hidden></p>
        <p class="save-status" id="ai-write-questions" hidden></p>
        <button class="build-button save-post-button" id="paste-ai-reply" type="button">📥 貼回 AI 寫好的</button>
        <button class="build-button save-post-button" id="save-post" type="button">💾 存檔</button>
        <p class="save-status" id="save-post-status" role="status"></p>
      </section>

      <section class="panel editor-panel" aria-labelledby="editor-title">
        <div class="panel-heading">
          <div>
            <h3 id="editor-title">貼文編輯</h3>
            <p>依照平台整理要發布的文字</p>
          </div>
          <span class="panel-tag">編輯</span>
        </div>
        <div class="tabs" id="platform-tabs" role="tablist" aria-label="平台"></div>
        <label class="editor-label" for="post-content">貼文內容</label>
        <textarea class="post-content" id="post-content" placeholder="從第一句讓人想看的話開始寫……"></textarea>
        <p class="character-count" id="character-count" aria-live="polite"></p>
        <button class="secondary-button undo-button" id="undo-ai" type="button" disabled>↩ 復原上一版</button>
        <button class="secondary-button undo-button" id="review-posts" type="button">🔍 檢查官</button>
        <p class="ai-helper-status" id="review-status" role="status"></p>
        <section class="ai-helper" aria-labelledby="ai-helper-title">
          <h3 id="ai-helper-title">💬 AI 小幫手</h3>
          <div class="ai-helper-history" id="ai-helper-history" aria-live="polite"></div>
          <div class="ai-helper-actions" id="ai-helper-actions">
            <button class="secondary-button" type="button">短一點</button>
            <button class="secondary-button" type="button">換開頭</button>
            <button class="secondary-button" type="button">少一點 emoji</button>
            <button class="secondary-button" type="button">更像範例</button>
          </div>
          <form class="ai-helper-form" id="ai-helper-form">
            <input id="ai-helper-input" type="text" aria-label="想修改的內容" placeholder="告訴 AI 想怎麼修改">
            <button class="primary-button" type="submit">送出</button>
          </form>
          <p class="ai-helper-status" id="ai-helper-status" role="status"></p>
        </section>
      </section>

      <section class="panel preview-panel" aria-labelledby="preview-title">
        <div class="panel-heading">
          <div>
            <h3 id="preview-title">手機預覽</h3>
            <p>貼文在手機上的版面示意</p>
          </div>
          <span class="panel-tag">預覽</span>
        </div>
        <div class="phone-wrap">
          <div class="phone" aria-label="手機畫面示意">
            <div class="phone-screen" id="phone-screen"></div>
          </div>

  <script>

    };

    // 貼文狀態集中在這裡，日後可自行調整名稱或順序。

    const materialFields = [
      { id: "date", label: "日期", placeholder: "例如：9/16 21:00", required: true },

      { id: "discount", label: "折扣", placeholder: "例如：新品2件折$50／3件折100／4件折200", required: false },
      { id: "mood", label: "一句心情", placeholder: "例如：不經意的漂亮（結果超吸睛）", required: true }
    ];

    const defaultBrandSpec = "# HelloMonady 品牌規格\n\n## 基本資料\n\n- **品牌名稱：** HelloMonady\n- **帳號名稱：** `@hello_monday.tw`\n- **主色色碼：** `#d3783c`\n- **使用平台：** Instagram（IG）\n\n## 1. 品牌口氣（寫具體）\n\n像喜歡分享好看東西的小姐姐，帶著一點私心推薦的語氣。具體來說：\n\n- 用「你」或「你們」，不用「您」「親愛的顧客」。\n- 一句最多 20 個字左右；一句只說一個穿搭感受、設計或優點。\n- 開頭先寫讓人想看下去的感覺，例如「這件白襯衫真的很危險🥺」或「新的心動，準備和你們見面。」\n- 講衣服時，寫看得到的設計和穿上後的感覺，例如蕾絲拼接、腰線、單穿方便、側面好看。\n- 「私心分享」可以自然使用，每篇最多 1 次，不必每篇都寫。\n- emoji 每篇最多 2 個；以 🥺、😏、☁️ 這類柔和表情為主。\n- 驚嘆號每篇最多 1 個。\n- 不用「您現在就要買」「手刀下單」「錯過可惜」這種催促語。\n- 不把沒有提供根據的感受寫成事實，例如「顯瘦」「人人都適合」「必買」。\n\n## 2. 不能用的字\n\n品牌卡未提供禁用字，暫列為 **❓待補**。\n\n在補充前，先不用以下容易顯得過度推銷的說法：\n\n- 「必買」「閉眼入」「史上最」「神級」「爆款」\n- 「最後機會」「手刀下單」「錯過可惜」\n- 「全網最低」「超划算」「CP 值爆表」\n\n## 3. 不准自己加的東西\n\n品牌卡沒有提供的內容，不能自行補寫：\n\n- 商品價格、折扣、滿額門檻、優惠日期與截止時間\n- 商品材質、尺寸、顏色、庫存與到貨時間\n- 未經確認的穿搭效果，例如顯瘦、修身、透氣或不易皺\n- 地址、營業時間、得獎、銷售數字或活動規則\n- 未提供的 hashtag、合作對象與促銷資訊\n\n不確定時，寫「❓待補」或先確認，不要猜。\n\n## 4. Instagram 的規則＋骨架＋範例\n\n### Instagram\n\n- **誰在看：** 喜歡年輕女裝、在 IG 上找穿搭靈感的年輕女生。\n- **多長：** 正文 4～7 行；一行只講一個重點。\n- **第一行寫什麼：** 一句讓人停下來看的穿搭感覺、私心分享或新品預告，可放 1 個 emoji。\n- **中間寫什麼：** 依序寫衣服看得到的設計、穿搭情境與一個具體亮點；沒有確認的材質、價格或活動資訊不寫。\n- **最後一行固定寫什麼：** `@hello_monday.tw`\n- **hashtag：** 品牌尚未提供固定 hashtag，先標記為 **❓待補**；確認前不自行新增。\n\n**骨架（照這個格子填）：**\n\n```\n（第 1 行：穿搭感覺／私心分享／新品預告＋最多 1 個 emoji）\n\n（第 2 行：商品或設計亮點）\n（第 3 行：穿上後的畫面或搭配方式）\n（第 4 行：另一個看得到的細節）\n\n（可選：已確認的活動資訊；未確認則不寫）\n\n@hello_monday.tw\n```\n\n**範例（照這篇的感覺寫）：**\n\n```\n喜歡的蕾絲穿搭\n怎麼搭都有不同的漂亮！\n自帶胸墊設計，單穿就可以出門\n不用再煩惱內搭（好方便😏）\nNew Arrival 優惠延長至今晚 9/22 23:59\n```\n\n> 上例中的優惠與日期只能在已確認仍有效時使用。\n\n**範例（照這篇的感覺寫）：**\n\n```\nOutfit check ☁️\n新的心動，準備和你們見面。\n```\n\n**範例（照這篇的感覺寫）：**\n\n```\n這件白襯衫真的很危險🥺\n乍看是很乾淨的白襯衫\n但側邊是蕾絲拼接設計\n腰線會被修得很漂亮\n站著好看 側面更好看🥺\n有一點氣質，又有一點純慾感。\n```\n\n## 5. 平台限定的規則\n\n- HelloMonady 目前只使用 Instagram；沒有確認要發 IG 的內容，不另外改寫到其他平台。\n- 活動、優惠與新品資訊要以最後確認的版本為準；尚未確定或要求保密的內容不發。\n- 貼文需要導流時，固定放 `@hello_monday.tw`；其他連結或購買方式沒有確認就不補寫。\n\n## 6. 寫之前一定要檢查\n\n- 商品名稱、價格、日期、時間、優惠與庫存，是否和最後確認的素材完全一致？\n- 有沒有自己補上材質、尺寸、顏色、穿著效果或活動規則？有就刪掉或標「❓待補」。\n- 第一行有沒有先帶出穿搭感覺或設計亮點？\n- 每一行是否只說一件事，全文是否在 4～7 行內？\n- 有沒有維持像小姐姐分享好看衣服的語氣，而非強迫下單？\n- 是否有放上 `@hello_monday.tw`？\n- hashtag 是否全為已確認可用的內容？未確認就不放。\n";
    const defaultChecklist = "# 通用檢查清單（每個品牌都可以用）\n\n> 第 5 節用：整份複製，貼到工作台的「⚙ 設定 → 檢查清單」。\n> 想加自己品牌的規則，直接加在最下面。\n\n## 事實（拿素材卡來對）\n\n1. 日期、星期幾、時間、價格，跟素材卡一模一樣嗎？\n2. 有沒有素材卡上沒有的東西？（數字、產地、材質、得獎、名額、驚喜）有的話刪掉。\n3. 客人要怎麼做（怎麼買、怎麼預約、去哪裡），寫清楚了嗎？\n\n## 平台\n\n4. 「只能在某個平台說的」，有沒有跑到別的平台？\n5. 「先不要講的」，每一篇都沒有出現嗎？\n6. 每個平台的固定結尾都有嗎？（照品牌規格的骨架）\n\n## 口氣\n\n7. 有沒有品牌規格裡「不能用的字」？\n8. 有沒有催人買的話？（快來、手刀、錯過可惜、最後機會）\n9. 讀起來像我們的品牌嗎？還是像百貨公司、像網美？\n\n## 檢查完\n\n- 每篇每條寫 ✅ 或 ❌。\n- 有 ❌ 的，先自己改好，再給我看。\n";

    document.title = `${brand.name}｜社群工作台`;
    document.getElementById("page-title").textContent = `${brand.name} v2｜社群工作台`;
    document.getElementById("top-account").textContent = brand.account;

    const storageKey = `社群工作台：${brand.account}：貼文草稿`;
    const workingStorageKey = `社群工作台：${brand.account}：工作中`;
    const savedPostsStorageKey = `社群工作台：${brand.account}：已存貼文`;
    let drafts = {};
    try {
      const storedDrafts = JSON.parse(localStorage.getItem(storageKey) || "{}");
      if (storedDrafts && typeof storedDrafts === "object" && !Array.isArray(storedDrafts)) {
        drafts = storedDrafts;
      }
    } catch { /* 瀏覽器無法讀取時，仍可在這次開啟期間編輯。 */ }

    let currentPostId = null;
    let currentPostStatus = "草稿";
    let workingCopy = null;
    let savedPosts = [];
    let igImageDataUrl = "";
    let aiConversations = {};
    let previousDrafts = null;
    let workingGeneration = 0;
    try {
      const storedWorking = JSON.parse(localStorage.getItem(workingStorageKey) || "null");
      if (storedWorking && typeof storedWorking === "object" && !Array.isArray(storedWorking)) {
        workingCopy = storedWorking;
      }
    } catch { /* 工作中資料無法讀取時，仍可使用舊版的貼文草稿。 */ }
    try {
      const storedPosts = JSON.parse(localStorage.getItem(savedPostsStorageKey) || "[]");
      if (Array.isArray(storedPosts)) {
        savedPosts = storedPosts
          .filter((post) => post && typeof post.id === "string")
          .map((post) => ({ ...post, status: normalizePostStatus(post.status) }));
      }
    } catch { /* 清單資料無法讀取時，保留目前可編輯的草稿。 */ }

    let activePlatform = platforms[0] || "IG";

    function normalizePostStatus(status) {
      return postStatuses.includes(status) ? status : postStatuses[0];
    }
    const postContent = document.getElementById("post-content");
    const characterCount = document.getElementById("character-count");
    const phoneScreen = document.getElementById("phone-screen");
    const undoAiButton = document.getElementById("undo-ai");
    const aiHelperHistory = document.getElementById("ai-helper-history");
    const aiHelperStatus = document.getElementById("ai-helper-status");

    function readAiConversations(value) {
      const conversations = {};
      if (!value || typeof value !== "object" || Array.isArray(value)) return conversations;
      platforms.forEach((platform) => {
        if (Array.isArray(value[platform])) {
          conversations[platform] = value[platform].filter((entry) =>
            entry && (entry.role === "user" || entry.role === "assistant") && typeof entry.content === "string"
          ).map((entry) => ({ role: entry.role, content: entry.content, display: typeof entry.display === "string" ? entry.display : entry.content }));
        }
      });
      return conversations;
    }

    function renderAiConversation() {
      aiHelperHistory.replaceChildren();
      (aiConversations[activePlatform] || []).forEach((entry) => {
        const message = document.createElement("div");
        message.className = "ai-helper-message";
        const label = document.createElement("strong");
        label.textContent = entry.role === "user" ? "我說的" : "AI 回覆";
        const content = document.createElement("span");
        content.textContent = entry.display;
        message.append(label, content);
        aiHelperHistory.append(message);
      });
      aiHelperHistory.scrollTop = aiHelperHistory.scrollHeight;
    }

    function updateUndoButton() { undoAiButton.disabled = previousDrafts === null; }

    function rememberPreviousDrafts() {
      previousDrafts = { ...drafts };
      updateUndoButton();
    }

    const previewTemplates = {
      FB: `<div class="phone-status" aria-hidden="true"></div>
        <div class="social-header"><span class="avatar" aria-hidden="true"></span>
          <span class="social-meta"><span class="social-account"></span><span class="social-time">剛剛</span></span></div>

      IG: `<div class="phone-status" aria-hidden="true"></div>
        <div class="social-header"><span class="avatar" aria-hidden="true"></span><span class="social-account"></span></div>
        <div class="preview-image is-placeholder" id="ig-preview-image">圖片預覽區</div>
        <div class="social-actions" aria-hidden="true"><span>♡</span><span>💬</span><span>➤</span></div>
        <p class="preview-copy" id="preview-copy"></p>
        <div class="preview-date" id="preview-date"></div>`,
      LINE: `<div class="phone-status" aria-hidden="true"></div>
        <div class="line-chat-row"><span class="avatar" aria-hidden="true"></span>
          <div class="line-bubble"><div id="preview-copy"></div><div class="preview-date" id="preview-date"></div></div></div>`,
      Threads: `<div class="phone-status" aria-hidden="true"></div>
        <div class="threads-post"><span class="avatar" aria-hidden="true"></span>
          <div class="threads-body"><span class="social-account"></span><p class="preview-copy" id="preview-copy"></p>
            <div class="preview-date" id="preview-date"></div></div></div>`
    };

    function saveDrafts() {
      try { localStorage.setItem(storageKey, JSON.stringify(drafts)); }
      catch { /* 儲存不可用時，草稿仍保留在目前頁面。 */ }
    }

    function updatePreviewContent() {
      const copy = document.getElementById("preview-copy");
      const draft = typeof drafts[activePlatform] === "string" ? drafts[activePlatform] : "";
      copy.textContent = draft.trim() ? draft : "貼文內容會顯示在這裡";
      copy.classList.toggle("is-placeholder", !draft.trim());

      const dateInput = document.getElementById(materialFields[0].id);
      const date = document.getElementById("preview-date");
      date.textContent = dateInput.value;
      date.hidden = !dateInput.value.trim();
    }

    function updatePreviewImage() {
      const image = document.getElementById("ig-preview-image");
      if (!image) return;
      const hasImage = Boolean(igImageDataUrl);
      image.textContent = hasImage ? "" : "圖片預覽區";
      image.classList.toggle("is-placeholder", !hasImage);
      image.classList.toggle("has-upload", hasImage);
      image.style.backgroundImage = hasImage ? `url("${igImageDataUrl}")` : "";
    }

    function updateCharacterCount() {
      const count = Array.from(postContent.value).length;
      const limit = platformCharacterLimits[activePlatform];
      const isOver = Number.isFinite(limit) && count > limit;
      characterCount.textContent = Number.isFinite(limit)
        ? `目前 ${count} 字／上限 ${limit} 字${isOver ? "，超過了" : ""}`
        : `目前 ${count} 字／上限未設定`;
      characterCount.classList.toggle("is-over", isOver);
    }

      });
      phoneScreen.querySelectorAll(".social-account").forEach((account) => {

      input.id = field.id;

    function persistAiContext() {
      persistWorkingCopy();
      if (!currentPostId) return;
      const index = savedPosts.findIndex((post) => post.id === currentPostId);
      if (index < 0) return;
      const nextPosts = [...savedPosts];
      nextPosts[index] = { ...nextPosts[index], aiConversations: readAiConversations(aiConversations), previousDrafts: previousDrafts && { ...previousDrafts } };

        localStorage.setItem(savedPostsStorageKey, JSON.stringify(nextPosts));

      const parts = new Intl.DateTimeFormat("zh-TW", {

      }).formatToParts(date);
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${values.year}/${values.month}/${values.day}`;
    }

    function savedTimeLabel(isoTime) {

      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",

      }).format(date);
    }

        actions.append(openButton, deleteButton);
        item.append(info, statusSelect, actions);
        cards.append(item);

    function formatDateWithWeekday(raw) {
      const value = raw.trim();
      if (!value) return "未填";
      const match = value.match(/^(?:(\d{4})[\/.-])?(\d{1,2})[\/.-](\d{1,2})(.*)$/);
      if (!match) return `${value}（日期格式待確認，無法加上星期）`;

      const year = match[1] ? Number(match[1]) : new Date().getFullYear();
      const month = Number(match[2]);
      const day = Number(match[3]);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
        return `${value}（日期格式待確認，無法加上星期）`;
      }

      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      const suffix = match[4].replace(/^\s*（[日一二三四五六]）/, "");
      return `${year}/${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}（${weekdays[date.getDay()]}）${suffix}`;
    }

    function formatMaterialCard() {
      return materialFields.map((field, index) => {

      }).join("\n");
    }

    function assemblePrompt() {
      const platformTitles = platforms.map((platform) => `【${platform}】`).join("、");
      const parts = [
        "（這段只要回覆文字，不要建立或修改任何檔案。）",
        `你是【${brand.name}】的小編。請照品牌規格，用素材卡的內容，替品牌規格允許的平台寫貼文。`,
        "規則：\n一律用台灣的繁體中文和台灣用語。不要出現簡體字，也不要用大陸用語（例如：視頻→影片、質量→品質、優化→改善、信息→訊息、網絡→網路、用戶→客人或使用者）。\n平台：只寫品牌規格已確認使用的平台；若規格只使用 IG，只輸出 IG，不寫 FB 或 LINE。平台專屬的內容與固定結尾只用在指定平台。\n事實：素材卡未填或未確認的商品品項、設計、材質、顏色、尺寸、穿搭方式、效果、價格和活動規則都不可自行補寫；範例只學語氣，不當成這次的事實。資訊不足時不要為了湊行數而編造，改用已確認的內容自然表達，必要時在【要問我的】詢問。\n日期與優惠：素材卡已確認且允許公開的日期、星期與時間應完整一致地寫出；日期或是否公開有疑問時先詢問，不猜測。只寫已確認的折扣，活動放在品牌骨架指定的可選位置，不渲染成催促購買；有效性、期限或其他規則未確認時不自行補寫，必要時在【要問我的】詢問。數字可用台灣自然寫法，但不得改變原意。\n語氣與格式：照品牌規格的骨架、語氣、禁用詞、emoji 和驚嘆號限制寫，分享句要自然，不硬湊素材詞。若 IG 規格要求正文 4～7 行，正文不含固定帳號結尾，非空白行各自計算；做不到時詢問需要補充的資訊，不編造。未確認的 hashtag 不加，不把缺少 hashtag 當作錯誤。\n只在指定平台使用限定資訊；先不要講的不能寫；需要確認的事項列在【要問我的】，不要放進可發布的貼文。",
        `回覆格式：只用獲准平台的標題（${platformTitles}）分開；標題下面直接寫該平台可發布的完整貼文，未獲准的平台不要輸出標題或貼文。需要我確認的事另用【要問我的】列出。`,
        `品牌規格全文：\n${settings.brandSpec}`,
        `素材卡：\n${formatMaterialCard()}`
      ];
      if (settings.checklist.trim()) {
        parts.push(`先寫貼文初稿，再依這張清單在內部逐項檢查；有問題就修改貼文。清單若要求列出 ✅ 或 ❌，也只在內部執行，不要把檢查紀錄當成貼文。\n${settings.checklist}`);
      }
      parts.push("最後只回覆品牌規格允許的平台的完整貼文，以及有需要時的【要問我的】。不要輸出檢查過程、✅／❌清單、評語或說明；每個平台標題下面必須是貼文，不是判斷結果。");
      return parts.join("\n\n");
    }

    const promptDialog = document.getElementById("prompt-dialog");
    const assembledPrompt = document.getElementById("assembled-prompt");
    const copyStatus = document.getElementById("copy-status");
    document.getElementById("build-prompt").addEventListener("click", () => {

    document.getElementById("close-prompt").addEventListener("click", () => promptDialog.close());
    document.getElementById("copy-prompt").addEventListener("click", async () => {

    function splitAiReply(text) {
      const headingPattern = /^【\s*(FB|IG|LINE|要問我的)\s*】\s*$/gm;
      const headings = [...text.matchAll(headingPattern)];
      const sections = {};
      headings.forEach((match, index) => {
        const contentStart = match.index + match[0].length;
        const contentEnd = index + 1 < headings.length ? headings[index + 1].index : text.length;
        sections[match[1]] = text.slice(contentStart, contentEnd).trim();
      });
      return sections;
    }

    function containsChecklistInsteadOfPost(sections) {
      return platforms.some((platform) => {
        const content = sections[platform] || "";
        const checkedLines = content.split("\n").filter((line) => /[✅❌]/u.test(line)).length;
        return checkedLines >= 2;
      });
    }

    function applyAiSections(sections) {
      const updatedPlatforms = platforms.filter((platform) =>
        Object.prototype.hasOwnProperty.call(sections, platform)
      );
      updatedPlatforms.forEach((platform) => { drafts[platform] = sections[platform]; });
      if (updatedPlatforms.length > 0) {
        saveDrafts();
        showPlatform(activePlatform);
        persistWorkingCopy();
      }
      return updatedPlatforms;
    }

    const aiUsageKey = `社群工作台：${brand.account}：AI用量`;
    const providerNames = { openrouter: "OpenRouter", gemini: "Gemini" };

    function todayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function freshDailyUsage() {
      return { date: todayKey(), openrouter: { calls: 0, cost: 0 }, gemini: { calls: 0, cost: 0 } };
    }

    let dailyAiUsage = freshDailyUsage();
    try {
      const stored = JSON.parse(localStorage.getItem(aiUsageKey) || "null");
      if (stored?.date === todayKey() && stored.openrouter && stored.gemini) {
        for (const provider of ["openrouter", "gemini"]) {
          dailyAiUsage[provider].calls = Number.isFinite(stored[provider].calls) ? stored[provider].calls : 0;
          dailyAiUsage[provider].cost = Number.isFinite(stored[provider].cost) ? stored[provider].cost : 0;
        }
      }
    } catch { /* 無法讀取時從今天重新計算。 */ }

    function currentDailyUsage() {
      if (dailyAiUsage.date !== todayKey()) dailyAiUsage = freshDailyUsage();
      return dailyAiUsage;
    }

    function saveDailyUsage() {
      try { localStorage.setItem(aiUsageKey, JSON.stringify(dailyAiUsage)); }
      catch { /* 儲存不可用時仍顯示本次瀏覽期間的用量。 */ }
    }

    function addAiCall(provider) {
      currentDailyUsage()[provider].calls += 1;
      saveDailyUsage();
    }

    function addAiUsage(provider, usage, runUsage) {
      if (!usage || typeof usage !== "object") return;
      if (typeof usage.total_tokens === "number" && Number.isFinite(usage.total_tokens)) {
        runUsage[provider].tokens += usage.total_tokens;
        runUsage[provider].hasTokens = true;
      }
      if (typeof usage.cost === "number" && Number.isFinite(usage.cost)) {
        runUsage[provider].cost += usage.cost;
        runUsage[provider].hasCost = true;
        currentDailyUsage()[provider].cost += usage.cost;
        saveDailyUsage();
      }
    }

    function formatAiCost(cost) {
      return `$${Number(cost).toFixed(6)}`;
    }

    function formatDailyAiUsage() {
      const today = currentDailyUsage();
      return `今天 OpenRouter ${today.openrouter.calls} 次 ${formatAiCost(today.openrouter.cost)}、Gemini ${today.gemini.calls} 次`;
    }

    function formatAiUsage(provider, runUsage) {
      const current = runUsage[provider];
      const tokens = current.hasTokens ? current.tokens : "—";
      const cost = current.hasCost ? formatAiCost(current.cost) : "$—（API 未提供費用）";
      return `這次用 ${providerNames[provider]}：${tokens} tokens 約 ${cost}｜${formatDailyAiUsage()}`;
    }

    function aiFailure(provider, reason, raw = "") {
      const error = new Error(reason);
      error.provider = provider;
      error.raw = raw;
      return error;
    }

    function apiErrorMessage(data) {
      const item = Array.isArray(data) ? data[0] : data;
      return String(typeof item === "string" ? item : item?.error?.message || item?.message || "");
    }

    function httpErrorReason(provider, status, message) {
      if (provider === "openrouter") {
        return { 401: "金鑰不對", 402: "全班的額度用完了", 404: "模型名稱打錯了", 429: "太多人同時在用" }[status]
          || `服務出錯（HTTP ${status}）`;
      }
      if (status === 400 && /api[\s_-]*key/i.test(message)) return "金鑰不對";
      return { 403: "沒有權限", 404: "模型名稱不對，或免費版不能用", 429: "免費額度用完了" }[status]
        || `服務出錯（HTTP ${status}）`;
    }

    function providerRequest(provider, messages, retryForLength = false) {
      if (provider === "openrouter") {
        return {
          url: "https://openrouter.ai/api/v1/chat/completions",
          key: settings.aiKey,
          body: {
            model: settings.openRouterCustomModel || settings.openRouterModel,
            messages, max_tokens: 4000,
            reasoning: retryForLength
              ? { enabled: false, exclude: true }
              : { effort: settings.reasoning, exclude: true },
            usage: { include: true }
          }
        };
      }
      return {
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
        key: settings.geminiKey,
        body: { model: settings.geminiModel, messages, reasoning_effort: "low" }
      };
    }

    async function requestAiReply(provider, messages, runUsage, retryForLength = false) {
      const request = providerRequest(provider, messages, retryForLength);
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 60000);
      addAiCall(provider);
      try {
        const response = await fetch(request.url, {
          method: "POST",
          headers: { Authorization: `Bearer ${request.key}`, "Content-Type": "application/json" },
          body: JSON.stringify(request.body),
          signal: controller.signal
        });
        let data;
        try { data = await response.json(); }
        catch (error) {
          if (controller.signal.aborted || error.name === "AbortError") throw error;
          data = null;
        }
        if (!response.ok) throw aiFailure(provider, httpErrorReason(provider, response.status, apiErrorMessage(data)));
        if (!data) throw aiFailure(provider, "回覆格式有問題");
        const result = Array.isArray(data) ? data[0] : data;
        addAiUsage(provider, result?.usage, runUsage);
        const choice = result?.choices?.[0];
        const text = typeof choice?.message?.content === "string"
          ? choice.message.content.replace(/<think>[\s\S]*?<\/think>/gi, "").trim()
          : "";
        if (!text) {
          const error = aiFailure(provider, choice?.finish_reason === "length"
            ? "輸出額度用完，沒有產生文字（可在 ⚙ 設定更換模型）"
            : "沒有回覆文字");
          if (choice?.finish_reason === "length") error.code = "empty_length";
          throw error;
        }
        return { text, finishReason: choice?.finish_reason };
      } catch (error) {
        if (error.provider === provider) throw error;
        if (controller.signal.aborted || error.name === "AbortError") {
          throw aiFailure(provider, provider === "gemini"
            ? "等太久（超過 60 秒，可在 ⚙ 設定改選其他 Gemini 模型後重試）"
            : "等太久");
        }
        if (error instanceof TypeError) throw aiFailure(provider, "連不到（檢查網路）");
        throw aiFailure(provider, "回覆格式有問題");
      } finally {
        clearTimeout(timeout);
      }
    }

    function postReplyIssue(text) {
      const sections = splitAiReply(text);
      if (containsChecklistInsteadOfPost(sections)) return { reason: "只回了檢查清單" };
      if (!platforms.some((platform) => Object.prototype.hasOwnProperty.call(sections, platform))) {
        return { reason: "找不到【平台】標題", raw: text };
      }
      return null;
    }

    async function askAI(messages, options = {}) {
      if (!settings.aiKey && !settings.geminiKey) throw new Error("還沒填金鑰。按 ⚙ 設定。");
      const order = settings.aiOrder === "gemini-only" ? ["gemini"]
        : settings.aiOrder === "openrouter-only" ? ["openrouter"]
          : settings.geminiKey ? ["openrouter", "gemini"] : ["openrouter"];
      const runUsage = {
        openrouter: { tokens: 0, hasTokens: false, cost: 0, hasCost: false },
        gemini: { tokens: 0, hasTokens: false, cost: 0, hasCost: false }
      };
      const failures = [];
      for (const provider of order) {
        const key = provider === "openrouter" ? settings.aiKey : settings.geminiKey;
        if (!key) {
          failures.push({ provider, reason: "還沒填金鑰", raw: "" });
          continue;
        }
        let unsplitRaw = "";
        try {
          let result;
          try {
            result = await requestAiReply(provider, messages, runUsage);
          } catch (error) {
            if (provider !== "openrouter" || error.code !== "empty_length") throw error;
            options.onProgress?.("OpenRouter 沒有產生文字，正在關閉思考後重試（會增加一次 API 呼叫）…");
            try {
              result = await requestAiReply(provider, messages, runUsage, true);
            } catch (retryError) {
              if (retryError.code === "empty_length" || /HTTP 400/.test(retryError.message)) {
                throw aiFailure(provider, "關閉思考後仍無法產生文字（可在 ⚙ 設定更換模型）");
              }
              throw retryError;
            }
          }
          let issue = options.validate?.(result.text);
          if (issue?.raw) unsplitRaw = issue.raw;
          if (issue && options.correction) {
            result = await requestAiReply(provider, [
              ...messages,
              { role: "assistant", content: result.text },
              { role: "user", content: options.correction }
            ], runUsage);
            issue = options.validate(result.text);
            if (issue?.raw) unsplitRaw = issue.raw;
          }
          if (issue) throw aiFailure(provider, issue.reason, issue.raw || "");
          return { ...result, provider, runUsage, fallbackReason: failures[0]?.reason || "" };
        } catch (error) {
          failures.push({ provider, reason: error.message || "服務出錯", raw: error.raw || unsplitRaw });
          if (provider === "openrouter" && order.includes("gemini")) {
            options.onProgress?.(`OpenRouter：${error.message || "服務出錯"}。正在改用 Gemini…`);
          }
        }
      }
      const description = failures.map((failure) => `${providerNames[failure.provider]}：${failure.reason}`).join("；");
      const noBackup = order.length === 1 && order[0] === "openrouter" && !settings.geminiKey ? "；沒有備胎" : "";
      const error = new Error(`${description}${noBackup}`);
      error.raw = failures.map((failure) => failure.raw).filter(Boolean).at(-1) || "";
      throw error;
    }

    const aiHelperForm = document.getElementById("ai-helper-form");

    async function sendAiHelper(instruction) {
      if (aiHelperBusy) return;
      const requestText = instruction.trim();
      if (!requestText) return;
      const platform = activePlatform;
      const original = typeof drafts[platform] === "string" ? drafts[platform] : "";
      aiHelperStatus.classList.remove("is-error");
      if (!original.trim()) {
        aiHelperStatus.textContent = "先讓 AI 寫一篇";
        return;
      }

      const generation = workingGeneration;
      const userContent = `目前的【${platform}】貼文：\n${original}\n\n請這樣改：${requestText}`;
      const history = (aiConversations[platform] || []).slice(-8).map(({ role, content }) => ({ role, content }));
      const systemContent = `你是【${brand.name}】的小編助理。使用者會叫你修改一篇【${platform}】貼文。只改使用者要求的地方，其他保持原樣；不能加素材卡上沒有的事實；遵守品牌規格；一律用台灣的繁體中文和台灣用語。不要出現簡體字，也不要用大陸用語（例如：視頻→影片、質量→品質、優化→改善、信息→訊息、網絡→網路、用戶→客人或使用者）。只回覆改好以後的整篇貼文，不要解釋、不要加標題。\n\n品牌規格全文：\n${settings.brandSpec}\n\n素材卡：\n${formatMaterialCard()}`;
      const messages = [{ role: "system", content: systemContent }, ...history, { role: "user", content: userContent }];

      aiHelperBusy = true;
      aiHelperControls.forEach((control) => { control.disabled = true; });
      aiHelperStatus.textContent = "AI 修改中…";
      try {
        const result = await askAI(messages, {
          onProgress: (message) => { if (generation === workingGeneration) aiHelperStatus.textContent = message; }
        });
        if (generation !== workingGeneration) return;
        const conversation = aiConversations[platform] || (aiConversations[platform] = []);
        conversation.push({ role: "user", content: userContent, display: requestText });
        conversation.push({ role: "assistant", content: result.text, display: result.text });
        if (drafts[platform] !== original) {
          aiHelperStatus.textContent = "貼文已變更，AI 回覆已保留在對話中，未覆蓋目前內容。";
        } else {
          rememberPreviousDrafts();
          drafts[platform] = result.text;
          saveDrafts();
          if (activePlatform === platform) showPlatform(platform);
          const notices = [];
          if (result.fallbackReason && result.provider === "gemini") notices.push(`⚠️ OpenRouter：${result.fallbackReason}。這次改用 Gemini。`);
          if (result.finishReason === "length") notices.push("回覆可能被切掉了");
          aiHelperStatus.textContent = notices.join(" ") || "已更新貼文。";
        }
        if (activePlatform === platform) renderAiConversation();
        persistAiContext();
        if (aiHelperInput.value.trim() === requestText) aiHelperInput.value = "";
      } catch (error) {
        if (generation === workingGeneration) {
          aiHelperStatus.classList.add("is-error");
          aiHelperStatus.textContent = error.message || "AI 連線失敗，請稍後再試。";
        }
      } finally {
        aiHelperBusy = false;
        aiHelperControls.forEach((control) => { control.disabled = false; });
      }
    }

      } catch (error) {
        if (generation === workingGeneration) {
          reviewStatus.classList.add("is-error");
          reviewStatus.textContent = error.message || "AI 連線失敗，請稍後再試。";
        }
      } finally {
        reviewButton.disabled = false;
      }
    });

    fixReviewButton.addEventListener("click", async () => {
      if (fixReviewButton.disabled || !reviewedDrafts || !reviewedReport) return;
      const currentDrafts = Object.fromEntries(["FB", "IG", "LINE"].map((platform) => [platform, drafts[platform] || ""]));
      const currentContext = JSON.stringify([settings.brandSpec, settings.checklist.trim() || defaultReviewChecklist, formatMaterialCard()]);
      if (Object.entries(reviewedDrafts).some(([platform, post]) => currentDrafts[platform] !== post) || currentContext !== reviewedContext) {
        reviewFixStatus.classList.add("is-error");
        reviewFixStatus.textContent = "貼文或資料已變更，請重新按 🔍 檢查官。";
        return;
      }
      const generation = workingGeneration;
      fixReviewButton.disabled = true;
      reviewButton.disabled = true;
      fixReviewButton.textContent = "修改中…";
      reviewFixStatus.classList.remove("is-error");
      reviewFixStatus.textContent = "正在依報告修改…";
      try {
        const result = await askAI([
          { role: "system", content: `你是【${brand.name}】的小編。依獨立檢查報告逐條修正貼文中真正的 ❌。只使用已確認的素材卡事實，遵守品牌規格；不自行發明商品、搭配、優惠期限或需要人工確認的事。⚠️ 項目只在資訊足夠時處理，仍需確認的事項列於【要問我的】。原本有貼文的每個平台都要用【IG】【FB】【LINE】標題輸出；保留的平台在標題下寫完整可發布的貼文，不需修改的保持原文；報告要求刪除整篇的平台，標題下只寫「（刪除）」。不要解釋或輸出檢查清單。內容一律用台灣繁體中文和台灣用語。` },
          { role: "user", content: `品牌規格全文：\n${settings.brandSpec}\n\n素材卡全文：\n${formatMaterialCard()}\n\n檢查報告：\n${reviewedReport}\n\n原貼文：\n${Object.entries(reviewedDrafts).map(([platform, post]) => `【${platform}】\n${post.trim() ? post : "（沒有貼文）"}`).join("\n\n")}` }
        ], {
          validate: (text) => {
            const sections = splitAiReply(text);
            if (containsChecklistInsteadOfPost(sections)) return { reason: "只回了檢查清單", raw: text };
            const changed = platforms.filter((platform) => Object.prototype.hasOwnProperty.call(sections, platform));
            if (!changed.length) return { reason: "找不到【平台】標題", raw: text };
            if (changed.some((platform) => !reviewedDrafts[platform].trim() || !sections[platform].trim()) ||
                platforms.some((platform) => reviewedDrafts[platform].trim() && !Object.prototype.hasOwnProperty.call(sections, platform))) {
              return { reason: "修改內容不完整", raw: text };
            }
            return null;
          },
          onProgress: (message) => { if (generation === workingGeneration) reviewFixStatus.textContent = message; }
        });
        if (generation !== workingGeneration || Object.entries(reviewedDrafts).some(([platform, post]) => (drafts[platform] || "") !== post) ||
            JSON.stringify([settings.brandSpec, settings.checklist.trim() || defaultReviewChecklist, formatMaterialCard()]) !== reviewedContext) {
          reviewFixStatus.textContent = "貼文已變更，請重新檢查後再修改。";
          return;
        }
        if (result.finishReason === "length") throw new Error("修改回覆被切掉了，請重試；原貼文仍保留。");
        const sections = splitAiReply(result.text);
        const updates = {};
        platforms.forEach((platform) => {
          if (Object.prototype.hasOwnProperty.call(sections, platform)) {
            updates[platform] = /^（刪除）$/.test(sections[platform]) ? "" : sections[platform];
          }
        });
        if (!Object.entries(updates).some(([platform, post]) => post !== (drafts[platform] || ""))) {
          reviewFixStatus.textContent = "AI 沒有修改貼文，請查看報告後重試。";
          return;
        }
        rememberPreviousDrafts();
        applyAiSections(updates);
        persistAiContext();
        reviewedDrafts = null;
        const notices = [];
        if (result.fallbackReason && result.provider === "gemini") notices.push(`⚠️ OpenRouter：${result.fallbackReason}。這次改用 Gemini。`);
        if (result.finishReason === "length") notices.push("回覆可能被切掉了，請再檢查貼文。");
        reviewFixStatus.textContent = `已修改 ${Object.keys(updates).join("、")}，舊版可按 ↩ 復原上一版。${notices.length ? ` ${notices.join(" ")}` : ""}`;
      } catch (error) {
        if (generation === workingGeneration) {
          reviewFixStatus.classList.add("is-error");
          reviewFixStatus.textContent = error.message || "AI 連線失敗，請稍後再試。";
        }
      } finally {
        fixReviewButton.textContent = "照報告改好";
        fixReviewButton.disabled = reviewedDrafts === null || !reviewedReport.includes("❌");
        reviewButton.disabled = false;
      }
    });

    document.getElementById("paste-ai-reply").addEventListener("click", () => {
      aiReplyStatus.textContent = "";
      aiQuestionsWrap.hidden = true;
      aiQuestionsOutput.value = "";
      aiReplyDialog.showModal();
    });
    document.getElementById("close-ai-reply").addEventListener("click", () => aiReplyDialog.close());
    document.getElementById("split-ai-reply").addEventListener("click", () => {
      const sections = splitAiReply(aiReplyInput.value);
      const updatedPlatforms = applyAiSections(sections);

      const questions = sections["要問我的"] || "";
      aiQuestionsOutput.value = questions;
      aiQuestionsWrap.hidden = !questions;

      if (updatedPlatforms.length === 0) {
        aiReplyStatus.textContent = "沒有找到【FB】【IG】或【LINE】標題，請確認格式。";
        return;
      }

      aiReplyStatus.textContent = `已分到：${updatedPlatforms.join("、")}。`;
    });
  </script>
</body>
</html>
